name: Build Miir Presenter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiirPresenter-v0.13-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiirPresenter-v0.13-debug-apk
          path: MiirPresenter-v0.13-debug.apk
          if-no-files-found: error
          retention-days: 30
